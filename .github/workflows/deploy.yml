name: Deploy Laravel

on:
  push:
    branches:
      - main
      - develop

jobs:
  deploy-prod:
    name: Deploy to Production
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Production
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: root
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            set -e

            cd /var/www/lyons-bowe-ai-backend

            echo "Deploying production..."

            git fetch origin
            git checkout main
            git reset --hard origin/main

            composer install --no-dev --optimize-autoloader

            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache

            php artisan migrate --force

            sudo systemctl restart php*-fpm

            echo "Production deploy complete"

      - name: Notify Teams (Production Success)
        if: success()
        run: |
          curl -i -X POST \
            -H "Content-Type: application/json" \
            -d '{
              "type": "AdaptiveCard",
              "version": "1.4",
              "body": [
                {
                  "type": "TextBlock",
                  "text": "PROD BACKEND • Deployment Successful",
                  "weight": "Bolder",
                  "size": "Large"
                },
                {
                  "type": "TextBlock",
                  "text": "Repository: ${{ github.repository }}",
                  "wrap": true
                },
                {
                  "type": "TextBlock",
                  "text": "Branch: main",
                  "wrap": true
                },
                {
                  "type": "TextBlock",
                  "text": "Triggered by: ${{ github.actor }}",
                  "wrap": true
                },
                {
                  "type": "TextBlock",
                  "text": "Commit: ${{ github.event.head_commit.message }}",
                  "wrap": true
                },
                {
                  "type": "TextBlock",
                  "text": "URL: https://github.com/${{ github.repository }}/commit/${{ github.sha }}",
                  "wrap": true
                }
              ]
            }' \
            "${{ secrets.TEAMS_WEBHOOK_PROD }}"

      - name: Notify Teams (Production Failure)
        if: failure()
        run: |
          curl -i -X POST \
            -H "Content-Type: application/json" \
            -d '{
              "type": "AdaptiveCard",
              "version": "1.4",
              "body": [
                {
                  "type": "TextBlock",
                  "text": "PROD BACKEND • Deployment Failed",
                  "weight": "Bolder",
                  "size": "Large"
                },
                {
                  "type": "TextBlock",
                  "text": "Repository: ${{ github.repository }}",
                  "wrap": true
                },
                {
                  "type": "TextBlock",
                  "text": "Branch: main",
                  "wrap": true
                },
                {
                  "type": "TextBlock",
                  "text": "Triggered by: ${{ github.actor }}",
                  "wrap": true
                },
                {
                  "type": "TextBlock",
                  "text": "Commit: ${{ github.event.head_commit.message }}",
                  "wrap": true
                },
                {
                  "type": "TextBlock",
                  "text": "Check GitHub Actions logs.",
                  "wrap": true
                },
                {
                  "type": "TextBlock",
                  "text": "URL: https://github.com/${{ github.repository }}/commit/${{ github.sha }}",
                  "wrap": true
                }
              ]
            }' \
            "${{ secrets.TEAMS_WEBHOOK_PROD }}"

  deploy-staging:
    name: Deploy to Staging
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Staging
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: root
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -e

            cd /var/www/lyons-bowe-ai-backend

            echo "Deploying staging..."

            git fetch origin
            git checkout develop
            git reset --hard origin/develop

            composer install --no-dev --optimize-autoloader

            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache

            php artisan migrate --force

            sudo systemctl restart php*-fpm

            echo "Staging deploy complete"

      - name: Notify Teams (Staging Success)
        if: success()
        run: |
          curl -i -X POST \
            -H "Content-Type: application/json" \
            -d '{
              "type": "AdaptiveCard",
              "version": "1.4",
              "body": [
                {
                  "type": "TextBlock",
                  "text": "STAGING BACKEND • Deployment Successful",
                  "weight": "Bolder",
                  "size": "Large"
                },
                {
                  "type": "TextBlock",
                  "text": "Repository: ${{ github.repository }}",
                  "wrap": true
                },
                {
                  "type": "TextBlock",
                  "text": "Branch: develop",
                  "wrap": true
                },
                {
                  "type": "TextBlock",
                  "text": "Triggered by: ${{ github.actor }}",
                  "wrap": true
                },
                {
                  "type": "TextBlock",
                  "text": "Commit: ${{ github.event.head_commit.message }}",
                  "wrap": true
                },
                {
                  "type": "TextBlock",
                  "text": "URL: https://github.com/${{ github.repository }}/commit/${{ github.sha }}",
                  "wrap": true
                }
              ]
            }' \
            "${{ secrets.TEAMS_WEBHOOK_STAGING }}"

      - name: Notify Teams (Staging Failure)
        if: failure()
        run: |
          curl -i -X POST \
            -H "Content-Type: application/json" \
            -d '{
              "type": "AdaptiveCard",
              "version": "1.4",
              "body": [
                {
                  "type": "TextBlock",
                  "text": "STAGING BACKEND • Deployment Failed",
                  "weight": "Bolder",
                  "size": "Large"
                },
                {
                  "type": "TextBlock",
                  "text": "Repository: ${{ github.repository }}",
                  "wrap": true
                },
                {
                  "type": "TextBlock",
                  "text": "Branch: develop",
                  "wrap": true
                },
                {
                  "type": "TextBlock",
                  "text": "Triggered by: ${{ github.actor }}",
                  "wrap": true
                },
                {
                  "type": "TextBlock",
                  "text": "Commit: ${{ github.event.head_commit.message }}",
                  "wrap": true
                },
                {
                  "type": "TextBlock",
                  "text": "Check GitHub Actions logs.",
                  "wrap": true
                },
                {
                  "type": "TextBlock",
                  "text": "URL: https://github.com/${{ github.repository }}/commit/${{ github.sha }}",
                  "wrap": true
                }
              ]
            }' \
            "${{ secrets.TEAMS_WEBHOOK_STAGING }}"