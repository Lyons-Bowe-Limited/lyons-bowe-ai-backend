name: Deploy Laravel

on:
  push:
    branches:
      - main
      - develop

jobs:
  deploy-prod:
    name: Deploy to Production
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Production
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: root
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            set -e

            cd /var/www/lyons-bowe-ai-backend

            echo "🚀 Deploying PRODUCTION..."

            git fetch origin
            git checkout main
            git reset --hard origin/main

            composer install --no-dev --optimize-autoloader

            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache

            php artisan migrate --force

            sudo systemctl restart php*-fpm

            echo "✅ Production deploy complete"

      - name: Notify Teams (Production Success)
        if: success()
        run: |
          curl -H "Content-Type: application/json" \
          -d '{
            "text": "🚀 Production Deployment SUCCESS\nRepo: ${{ github.repository }}\nBranch: main\nCommit: ${{ github.sha }}\nMessage: ${{ github.event.head_commit.message }}"
          }' \
          ${{ secrets.TEAMS_WEBHOOK_PROD }}

      - name: Notify Teams (Production Failure)
        if: failure()
        run: |
          curl -H "Content-Type: application/json" \
          -d '{
            "text": "❌ Production Deployment FAILED\nRepo: ${{ github.repository }}\nBranch: main\nCheck GitHub Actions logs."
          }' \
          ${{ secrets.TEAMS_WEBHOOK_PROD }}


  deploy-staging:
    name: Deploy to Staging
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Staging
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: root
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -e

            cd /var/www/lyons-bowe-ai-backend

            echo "🧪 Deploying STAGING..."

            git fetch origin
            git checkout develop
            git reset --hard origin/develop

            composer install --no-dev --optimize-autoloader

            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache

            php artisan migrate --force

            sudo systemctl restart php*-fpm

            echo "✅ Staging deploy complete"

      - name: Notify Teams (Staging Success)
        if: success()
        run: |
          curl -H "Content-Type: application/json" \
          -d '{
            "text": "🧪 Staging Deployment SUCCESS\nRepo: ${{ github.repository }}\nBranch: develop\nCommit: ${{ github.sha }}\nMessage: ${{ github.event.head_commit.message }}"
          }' \
          ${{ secrets.TEAMS_WEBHOOK_STAGING }}

      - name: Notify Teams (Staging Failure)
        if: failure()
        run: |
          curl -H "Content-Type: application/json" \
          -d '{
            "text": "❌ Staging Deployment FAILED\nRepo: ${{ github.repository }}\nBranch: develop\nCheck GitHub Actions logs."
          }' \
          ${{ secrets.TEAMS_WEBHOOK_STAGING }}